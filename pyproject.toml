[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-coder"
version = "0.6.1"
description = "A scoped, MCP-powered coding agent that puts Qwen Coder (or any OpenAI-compatible model) to work in your codebase"
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "httpx>=0.28",
    "rich>=15.0",
    "typer>=0.27",
    "mcp>=1.27",
    "prompt_toolkit>=3.0",
    "python-ripgrep>=0.0.7",
]

[project.optional-dependencies]
# On-device embeddings for search_tools semantic ranking of deferred MCP
# tools (the default embedding_model="nomic-local"). Without this installed,
# search_tools falls back to plain keyword matching automatically.
local-embeddings = ["nomic[local]"]

# Test suite: `pip install -e ".[dev]"` then `pytest`
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-mock>=3.14", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/HarryChen1995/omni-coder"
Repository = "https://github.com/HarryChen1995/omni-coder"
Issues = "https://github.com/HarryChen1995/omni-coder/issues"

[project.scripts]
omni = "omni.cli:app"

[tool.setuptools.packages.find]
include = ["omni*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# asyncio_mode=auto: `async def test_*` runs without a per-test decorator.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    # Spawns real MCP server subprocesses over stdio. Deselect with -m "not live".
    "live: exercises real transports/subprocesses rather than mocks",
]

[tool.coverage.run]
source = ["omni"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    'if __name__ == "__main__":',
    "raise NotImplementedError",
]
